name: zengly
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.7.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.1.0
  go_router: ^15.1.2
  google_fonts: ^6.3.3
  path_provider: ^2.1.5
  smooth_page_indicator: ^1.2.1
  pinput: ^5.0.1
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  local_auth: ^2.3.0
  app_settings: ^5.1.1
  toastification: ^3.0.2
  flutter_flavorizr: ^2.4.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  phone_form_field: ^3.0.1
  package_info_plus: ^8.3.0
  file_picker: ^10.1.9
  path: ^1.9.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  dotted_dashed_line: ^0.0.3
  dotted_border: ^3.0.1
  flutter_contacts: ^1.1.9+2
  share_plus: ^11.0.0
  simple_gradient_text: ^1.3.0
  skeletonizer: ^2.1.0+1
  camera: ^0.11.2
  flutter_launcher_icons: ^0.14.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1
  flutter_dotenv: ^5.2.1
  fl_chart: ^1.2.0
  lottie: ^3.3.3
  video_player: ^2.11.1
  mobile_scanner: ^7.2.0
  firebase_core: ^4.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:

  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_24pt-Regular.ttf
        - asset: assets/fonts/Inter/static/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter_24pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/static/Inter_24pt-Bold.ttf
          weight: 700
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway/static/Raleway-Regular.ttf
        - asset: assets/fonts/Raleway/static/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway/static/Raleway-Bold.ttf
          weight: 700
    # - family: Open Sans
    #   fonts:
    #     - asset: assets/fonts/OpenSans-Regular.ttf



  assets:
    - assets/images/
    - assets/countries/
    - assets/gifs/
    - assets/animations/
    - assets/videos/
    - assets/icons/
    - assets/account/
    - assets/networks/
    - assets/tv/
    - assets/country_flags/
    - assets/fonts/
    - .env

flavorizr:
  ide: "vscode"
  flavors:
    dev:
      app:
        name: "Zengly Dev"

      android:
        applicationId: "com.zengly.dev"  
      ios:
        bundleId: "com.zengly.dev"
      macos:
        bundleId: "com.zengly.dev"  
    prod:
      app:
        name: "Zengly"
    
      android:
        applicationId: "com.zengly.prod"
      ios:
        bundleId: "com.zengly.prod"
      macos:
        bundleId: "com.zengly.prod"
      

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/applogo_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/applogo_foreground.png"
  image_path_ios: "assets/icons/applogo_icon.png"
  remove_alpha_ios: true